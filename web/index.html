<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b0a" />
    <title>Thus Spoke Zakura</title>
  </head>
  <body>
    <script>
      // Applied before first paint so a dark-theme reload never flashes white.
      // Mirrors readStoredTheme()/applyTheme() in src/lib/theme.ts.
      try {
        var t = localStorage.getItem('ths-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <div id="root"></div>
    <noscript>The Thus Spoke Zakura dashboard requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
